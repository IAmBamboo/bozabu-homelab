name: Deploy Website

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    # Run directly on your self-hosted Pi runner
    runs-on: self-hosted

    steps:
      - name: Pull latest website changes
        run: |
          cd ~/pi5-services/www
          git fetch origin main
          git reset --hard origin/main
          if [ -d site ]; then
            cp -r site/* .
          fi

      - name: Restart web container
        run: |
          cd ~/pi5-services
          docker restart web
